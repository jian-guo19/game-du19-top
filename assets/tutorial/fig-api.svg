<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fe"/><stop offset="1" stop-color="#edf1fb"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#283470" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="680" height="330" fill="url(#bg)"/>
  <circle cx="648" cy="16" r="70" fill="#c9d7ff" opacity="0.3"/>
  <circle cx="32" cy="316" r="64" fill="#ffd8b8" opacity="0.26"/>

  <text x="28" y="36" font-size="19" font-weight="700" fill="#252b45">让它能回话：两条路，选一条就够</text>
  <text x="28" y="59" font-size="12.5" fill="#6b7285">酒馆自己不写故事，它只负责把你的话和角色设定一起送出去。</text>

  <g filter="url(#sh)">
    <rect x="28" y="92" width="292" height="152" rx="15" fill="#eaf2ff" stroke="#6e9fe4" stroke-width="1.5"/>
    <rect x="360" y="92" width="292" height="152" rx="15" fill="#f3edff" stroke="#a17bda" stroke-width="1.5"/>
  </g>

  <text x="46" y="120" font-size="15" font-weight="700" fill="#2f5f9e">A · 本地模型</text>
  <text x="46" y="141" font-size="11.5" fill="#60738f">不花钱，但吃显卡，第一次加载慢</text>
  <g font-size="12.5" fill="#3c5372">
    <text x="46" y="169">① 先把本地运行环境装好</text>
    <text x="46" y="193">② 在酒馆里选择本地后端</text>
    <text x="46" y="217">③ 模型载入完成后再发消息</text>
  </g>

  <text x="378" y="120" font-size="15" font-weight="700" fill="#68439b">B · 在线接口</text>
  <text x="378" y="141" font-size="11.5" fill="#6d6280">要一个 Key，按用量计费，上手最快</text>
  <g font-size="12.5" fill="#574d70">
    <text x="378" y="169">① 复制服务商给的 Key</text>
    <text x="378" y="193">② 填接口地址 + 模型名</text>
    <text x="378" y="217">③ 先发一句「在吗」测试</text>
  </g>

  <circle cx="340" cy="168" r="21" fill="#fff" stroke="#c8cfe4" stroke-width="1.4"/>
  <text x="340" y="173" font-size="12" font-weight="700" fill="#6b7285" text-anchor="middle">二选一</text>

  <rect x="28" y="264" width="624" height="46" rx="10" fill="#fff" fill-opacity="0.9" stroke="#dbe2f2" stroke-dasharray="4 3"/>
  <text x="42" y="284" font-size="12" fill="#4a5570">Key 只填在酒馆自己的设置里；截图发人前一定打码。填完记得保存，再回聊天页发第一句。</text>
  <text x="42" y="301" font-size="12" fill="#4a5570">模型名写错也会「没人回话」——先原样复制服务商页面上的那串名字。</text>
</svg>
