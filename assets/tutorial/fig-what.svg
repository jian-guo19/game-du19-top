<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268" width="680" height="268" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fe"/><stop offset="1" stop-color="#edf1fb"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#283470" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="680" height="268" fill="url(#bg)"/>
  <circle cx="640" cy="18" r="76" fill="#c9d7ff" opacity="0.3"/>
  <circle cx="40" cy="250" r="70" fill="#ffd8b8" opacity="0.28"/>

  <text x="28" y="36" font-size="19" font-weight="700" fill="#252b45">酒馆在你电脑里，到底站在哪一段</text>
  <text x="28" y="59" font-size="12.5" fill="#6b7285">它自己不写故事，只负责把你和角色卡一起交出去，再把回话摆回你面前。</text>

  <g filter="url(#sh)">
    <rect x="28" y="86" width="140" height="112" rx="13" fill="#fff5e9" stroke="#e6a45c" stroke-width="1.4"/>
    <rect x="190" y="86" width="140" height="112" rx="13" fill="#eaf2ff" stroke="#6e9fe4" stroke-width="1.4"/>
    <rect x="352" y="86" width="140" height="112" rx="13" fill="#f3edff" stroke="#a17bda" stroke-width="1.4"/>
    <rect x="514" y="86" width="140" height="112" rx="13" fill="#e8f8f0" stroke="#57b58c" stroke-width="1.4"/>
  </g>

  <circle cx="46" cy="104" r="11" fill="#e6a45c"/><text x="46" y="109" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <circle cx="208" cy="104" r="11" fill="#6e9fe4"/><text x="208" y="109" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <circle cx="370" cy="104" r="11" fill="#a17bda"/><text x="370" y="109" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <circle cx="532" cy="104" r="11" fill="#57b58c"/><text x="532" y="109" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>

  <text x="42" y="132" font-size="15" font-weight="700" fill="#8a5a20">你</text>
  <text x="42" y="153" font-size="11.5" fill="#6b6259">浏览器里打字</text>
  <text x="42" y="171" font-size="11.5" fill="#6b6259">localhost:8000</text>

  <text x="204" y="132" font-size="15" font-weight="700" fill="#2f5f9e">酒馆</text>
  <text x="204" y="153" font-size="11.5" fill="#4a5b72">本地服务，负责</text>
  <text x="204" y="171" font-size="11.5" fill="#4a5b72">拼提示词、存记录</text>

  <text x="366" y="132" font-size="15" font-weight="700" fill="#68439b">模型接口</text>
  <text x="366" y="153" font-size="11.5" fill="#5b5470">要一个 Key</text>
  <text x="366" y="171" font-size="11.5" fill="#5b5470">才有人回话</text>

  <text x="528" y="132" font-size="15" font-weight="700" fill="#247a59">角色卡</text>
  <text x="528" y="153" font-size="11.5" fill="#4a665b">一张 PNG</text>
  <text x="528" y="171" font-size="11.5" fill="#4a665b">里面藏着设定</text>

  <g stroke="#9aa6c4" stroke-width="1.8" fill="none">
    <path d="M170 142 L184 142"/><path d="M332 142 L346 142"/><path d="M494 142 L508 142"/>
  </g>
  <g fill="#9aa6c4">
    <path d="M184 138 L190 142 L184 146 Z"/><path d="M346 138 L352 142 L346 146 Z"/><path d="M508 138 L514 142 L508 146 Z"/>
  </g>

  <rect x="28" y="218" width="626" height="32" rx="9" fill="#fff" fill-opacity="0.88" stroke="#dbe2f2" stroke-dasharray="4 3"/>
  <text x="42" y="239" font-size="12.5" fill="#4a5570">关键：浏览器只是窗口。聊天记录、角色卡、配置全在你自己的硬盘上。</text>
</svg>
