<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" width="680" height="304" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fe"/><stop offset="1" stop-color="#edf1fb"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#283470" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="680" height="304" fill="url(#bg)"/>
  <circle cx="646" cy="14" r="70" fill="#c9d7ff" opacity="0.3"/>
  <circle cx="34" cy="290" r="64" fill="#ffd8b8" opacity="0.26"/>

  <text x="28" y="36" font-size="19" font-weight="700" fill="#252b45">想让酒馆出图，中间多了一层</text>
  <text x="28" y="59" font-size="12.5" fill="#6b7285">文字聊天和画图片不是同一个功能——出图要额外装扩展，再配一个图像接口。</text>

  <g filter="url(#sh)">
    <rect x="28" y="88" width="140" height="118" rx="13" fill="#fff5e9" stroke="#e6a45c" stroke-width="1.4"/>
    <rect x="190" y="88" width="140" height="118" rx="13" fill="#eaf2ff" stroke="#6e9fe4" stroke-width="1.4"/>
    <rect x="352" y="88" width="140" height="118" rx="13" fill="#f3edff" stroke="#a17bda" stroke-width="1.4"/>
    <rect x="514" y="88" width="140" height="118" rx="13" fill="#e8f8f0" stroke="#57b58c" stroke-width="1.4"/>
  </g>
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="46" cy="106" r="10" fill="#e6a45c"/><text x="46" y="110">1</text>
    <circle cx="208" cy="106" r="10" fill="#6e9fe4"/><text x="208" y="110">2</text>
    <circle cx="370" cy="106" r="10" fill="#a17bda"/><text x="370" y="110">3</text>
    <circle cx="532" cy="106" r="10" fill="#57b58c"/><text x="532" y="110">4</text>
  </g>
  <g font-size="14" font-weight="700">
    <text x="42" y="134" fill="#8a5a20">你点生成</text>
    <text x="204" y="134" fill="#2f5f9e">酒馆扩展</text>
    <text x="366" y="134" fill="#68439b">图像接口</text>
    <text x="528" y="134" fill="#247a59">图片回来</text>
  </g>
  <g font-size="11.5" fill="#5f687d">
    <text x="42" y="157">输入画面描述</text><text x="42" y="176">或让 AI 写</text>
    <text x="204" y="157">把描述打包</text><text x="204" y="176">成接口请求</text>
    <text x="366" y="157">真正画图的</text><text x="366" y="176">是外部服务</text>
    <text x="528" y="157">显示在聊天里</text><text x="528" y="176">可另存到本地</text>
  </g>
  <g stroke="#9aa6c4" stroke-width="1.8" fill="none">
    <path d="M170 147 L184 147"/><path d="M332 147 L346 147"/><path d="M494 147 L508 147"/>
  </g>
  <g fill="#9aa6c4">
    <path d="M184 143 L190 147 L184 151 Z"/><path d="M346 143 L352 147 L346 151 Z"/><path d="M508 143 L514 147 L508 151 Z"/>
  </g>

  <rect x="28" y="226" width="626" height="56" rx="10" fill="#fff" fill-opacity="0.9" stroke="#dbe2f2" stroke-dasharray="4 3"/>
  <text x="42" y="247" font-size="12" fill="#4a5570">没装扩展，就没有「生成图片」按钮；装了扩展，也要单独填图像服务的地址和 Key。</text>
  <text x="42" y="265" font-size="12" fill="#4a5570">文字接口的 Key 不能自动拿去画图。生成的图默认只是聊天里的一张图，记得手动保存。</text>
</svg>
