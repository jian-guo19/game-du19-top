name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Pages project exists
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 0f62d1e4af076d41a94f7489551ab364
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"game-du19-top","production_branch":"master"}' || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0f62d1e4af076d41a94f7489551ab364
          command: pages deploy . --project-name=game-du19-top --branch=master

      - name: Attach custom domain
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 0f62d1e4af076d41a94f7489551ab364
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/game-du19-top/domains" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"game.du-19.top"}' || true

      - name: Ensure DNS record
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -sS \
            "https://api.cloudflare.com/client/v4/zones?name=du-19.top" \
            -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id // empty')
          if [ -n "$ZONE_ID" ]; then
            curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"type":"CNAME","name":"game.du-19.top","content":"game-du19-top.pages.dev","proxied":true,"ttl":1}' || true
          else
            echo "Zone du-19.top not found or token has no Zone Read permission"
          fi
