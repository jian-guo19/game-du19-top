name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0f62d1e4af076d41a94f7489551ab364
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure Pages project exists
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"game-du19-top","production_branch":"master"}' || true

      # 建库（幂等）→ 建表 → 把 database_id 写进 wrangler.toml
      - name: Ensure D1 database and schema
        id: d1
        run: python3 scripts/ensure_d1.py

      # 数据文件语法校验：字符串里混入真实换行会让整站 JS 崩掉且页面空白
      - name: Validate data files
        run: |
          set -e
          for f in data/*.js; do
            echo "检查 $f"
            node --check "$f"
          done
          echo "数据文件语法 OK"

      # 文本编码体检：挡「UTF-8 被按 latin-1 存盘」导致的首页乱码
      - name: Check text encoding
        run: python3 scripts/check_encoding.py

      # 安全策略回归测试：限流、密码强度、fail-closed 门禁、安全响应头
      - name: Security policy tests
        run: node scripts/test_security.mjs

      # 给 JS/CSS 加内容哈希，避免浏览器拿 4 小时缓存的旧版本
      - name: Stamp asset versions
        run: python3 scripts/stamp_assets.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0f62d1e4af076d41a94f7489551ab364
          command: pages deploy . --project-name=game-du19-top --branch=master

      - name: Attach custom domain
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/game-du19-top/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"game.du-19.top"}' || true
