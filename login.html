<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>登录 · game.du-19.top</title>
  <style>
    :root {
      --hue: 240;
      --primary: hsl(var(--hue) 75% 62%);
      --text: #2e2e35;
      --text-2: #6b6b78;
      --text-3: #9a9aa6;
      --bg: #f7f7fa;
      --card: #ffffff;
      --border: rgba(0, 0, 0, 0.07);
      --radius: 14px;
      --radius-sm: 9px;
      --shadow: 0 2px 14px rgba(40, 40, 80, 0.05);
      --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background:
        radial-gradient(900px 480px at 12% -12%, hsl(var(--hue) 90% 95%), transparent 62%),
        radial-gradient(760px 460px at 92% 112%, hsl(210 90% 95%), transparent 62%),
        var(--bg);
      color: var(--text); font: 15px/1.6 var(--font); padding: 24px;
    }
    .card {
      width: 100%; max-width: 396px; background: var(--card);
      border: 1px solid var(--border); border-radius: 18px; padding: 28px 26px 24px;
      box-shadow: 0 18px 50px rgba(40, 40, 80, 0.10);
    }
    .brand { display: flex; align-items: center; gap: 10px; justify-content: center; }
    .brand img { width: 34px; height: 34px; border-radius: 9px; }
    .brand span { font-weight: 700; letter-spacing: .04em; }
    h1 { font-size: 18px; text-align: center; margin: 14px 0 4px; font-weight: 600; }
    .sub { text-align: center; color: var(--text-3); font-size: 13px; margin: 0 0 20px; }
    .tabs { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 12px; margin-bottom: 6px; }
    .tabs button {
      flex: 1; padding: 9px 0; border: 0; border-radius: 9px; cursor: pointer;
      background: transparent; color: var(--text-2); font-size: 14px; font-weight: 600;
      font-family: inherit; transition: .18s;
    }
    .tabs button.on { background: var(--card); color: var(--primary); box-shadow: var(--shadow); }
    label { display: block; font-size: 13px; color: var(--text-2); margin: 14px 0 6px; }
    input {
      width: 100%; padding: 11px 13px; border-radius: var(--radius-sm); font-size: 15px;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      font-family: inherit; outline: none; transition: .16s;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px hsl(var(--hue) 75% 62% / .14); }
    .btn {
      width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: var(--radius-sm);
      background: var(--primary); color: #fff; font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer; transition: .18s;
    }
    .btn:hover { background: hsl(var(--hue) 75% 56%); }
    .btn:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 20px; text-align: center; color: var(--text-3); }
    .msg.err { color: #e0556e; }
    .msg.ok { color: #22a06b; }
    .hint { margin-top: 10px; font-size: 12px; color: var(--text-3); text-align: center; }
    .foot { margin-top: 16px; text-align: center; font-size: 12.5px; color: var(--text-3); }
    .foot a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="assets/logo.png" alt="" onerror="this.style.display='none'" />
      <span>du-19</span>
    </div>
    <h1 id="title">登录后查看游戏库</h1>
    <p class="sub">本站收录内容含成人向题材，仅面向成年玩家</p>

    <div class="tabs" role="tablist">
      <button id="tabLogin" class="on" type="button">登录</button>
      <button id="tabReg" type="button">注册</button>
    </div>

    <form id="form">
      <label for="u">用户名</label>
      <input id="u" name="username" type="text" required minlength="3" maxlength="24"
             autocomplete="username" placeholder="3–24 个字符" />
      <label for="p">密码</label>
      <input id="p" name="password" type="password" required minlength="6"
             autocomplete="current-password" placeholder="至少 6 位" />
      <button class="btn" id="submit" type="submit">登录</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="hint" id="hint"></div>
    <div class="foot"><a href="https://du-19.top/">← 返回博客</a></div>
  </div>

  <script>
    (function () {
      var mode = 'login';
      var tabLogin = document.getElementById('tabLogin');
      var tabReg = document.getElementById('tabReg');
      var form = document.getElementById('form');
      var msg = document.getElementById('msg');
      var hint = document.getElementById('hint');
      var submit = document.getElementById('submit');
      var title = document.getElementById('title');
      var pwd = document.getElementById('p');

      var next = new URLSearchParams(location.search).get('next') || '/';
      if (next.charAt(0) !== '/') next = '/';

      function say(text, kind) {
        msg.textContent = text || '';
        msg.className = 'msg' + (kind ? ' ' + kind : '');
      }

      function setMode(m) {
        mode = m;
        tabLogin.classList.toggle('on', m === 'login');
        tabReg.classList.toggle('on', m === 'register');
        submit.textContent = m === 'login' ? '登录' : '注册并登录';
        title.textContent = m === 'login' ? '登录后查看游戏库' : '注册一个账号';
        pwd.autocomplete = m === 'login' ? 'current-password' : 'new-password';
        hint.textContent = m === 'register'
          ? '注册后自动登录；第一个注册的账号会成为管理员' : '';
        say('');
      }

      tabLogin.addEventListener('click', function () { setMode('login'); });
      tabReg.addEventListener('click', function () { setMode('register'); });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var username = document.getElementById('u').value.trim();
        var password = document.getElementById('p').value;
        if (!username || !password) { say('用户名和密码都要填', 'err'); return; }

        submit.disabled = true;
        say(mode === 'login' ? '登录中…' : '注册中…');

        fetch('/api/' + mode, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok) { say(res.d.error || '失败了，稍后再试', 'err'); submit.disabled = false; return; }
            say('成功，正在进入…', 'ok');
            location.replace(next);
          })
          .catch(function () { say('网络错误，请重试', 'err'); submit.disabled = false; });
      });

      fetch('/api/me', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d && d.user) location.replace(next); })
        .catch(function () {});

      setMode('login');
    })();
  </script>
</body>
</html>
