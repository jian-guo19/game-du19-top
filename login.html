<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="assets/icons/site.webmanifest" />
  <meta name="theme-color" content="#6b5cf0" />
  <title>登录 · game.du-19.top</title>
  <link rel="stylesheet" href="assets/login.css" />
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="assets/logo.png" alt="" />
      <span>du-19</span>
    </div>
    <h1 id="title">登录后查看游戏库</h1>
    <p class="sub">本站收录内容含成人向题材，仅面向成年玩家</p>

    <div class="tabs" role="tablist">
      <button id="tabLogin" class="on" type="button">登录</button>
      <button id="tabReg" type="button">注册</button>
    </div>

    <form id="form">
      <label for="u">用户名</label>
      <input id="u" name="username" type="text" required minlength="3" maxlength="24"
             autocomplete="username" placeholder="3–24 个字符" />
      <label for="p">密码</label>
      <input id="p" name="password" type="password" required minlength="1"
             autocomplete="current-password" placeholder="请输入密码" />
      <div id="tsBox"></div>
      <button class="btn" id="submit" type="submit">登录</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="hint" id="hint"></div>
    <div class="foot">
      <a href="/guide.html">解压遇到问题？看新手区（无需登录）</a> ·
      <a href="https://du-19.top/">← 返回博客</a>
    </div>
  </div>

  <script src="data/site-config.js"></script>
  <script src="assets/login.js"></script>
</body>
</html>
